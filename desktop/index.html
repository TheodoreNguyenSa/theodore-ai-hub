<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: #eef1f4; color: #18202b; }
  @media (prefers-color-scheme: dark) { body { background: #1b2129; color: #e4e9ef; } p { color: #aab4c0 !important; } }
  main { text-align: center; max-width: 520px; padding: 24px; }
  h1 { font: 600 20px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 14px 0 6px; }
  p { color: #4a5666; margin: 0; }
  .err { display: none; margin-top: 16px; text-align: left; background: rgba(192, 53, 44, 0.1); color: #c0352c; padding: 12px 14px; border-radius: 8px; overflow-wrap: anywhere; }
  svg path { stroke-dasharray: 70; animation: run 1.4s ease-in-out infinite; }
  @keyframes run { from { stroke-dashoffset: 140; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { svg path { animation: none; } }
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#b65a35"/><stop offset="1" stop-color="#3346d3"/></linearGradient></defs><path d="M10 42 C 20 42, 22 22, 32 22 S 44 42, 54 42" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><circle cx="10" cy="42" r="6.5" fill="#b65a35"/><circle cx="54" cy="42" r="6.5" fill="#3346d3"/></svg>
  <h1 id="t">Starting Relay…</h1>
  <p id="s">Finding your agents and opening the chats you left.</p>
  <div class="err" id="e"></div>
</main>
<script>
  window.relayError = function (msg) {
    document.getElementById('t').textContent = 'Relay could not start';
    document.getElementById('s').textContent = 'The log is in the .relay folder of your user profile (desktop.log, server.log).';
    var e = document.getElementById('e'); e.style.display = 'block'; e.textContent = msg;
  };
</script>
</body>
</html>
