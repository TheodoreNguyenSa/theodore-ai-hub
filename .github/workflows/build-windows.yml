# Tests on Windows (the flow tests run the fake agent in real ConPTY terminals), then builds the installers:
#   Theodore AI Hub_<version>_x64-setup.exe  (NSIS, per-user install, no admin needed)
#   Theodore AI Hub_<version>_x64_en-US.msi  (WiX)
# Push a tag like v0.1.0 to also attach them to a GitHub Release. "Run workflow" builds them on demand.
name: Build Windows installer

on:
  push:
    tags: ['v*']
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --test-force-exit: on Windows node-pty keeps a ConPTY reader thread alive after the agents exit, so without it
      # the runner waits forever once every test has passed
      - name: Tests (fake agent in ConPTY, MCP server, approvals, skills)
        run: npm test

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Bundle a Node runtime (node.exe, checksum-verified)
        run: node scripts/fetch-node.mjs --platform win32 --arch x64
      - name: Stage server, page and runtime modules
        run: node scripts/stage.mjs --platform win32 --arch x64
      - name: Smoke test the staged server with the bundled node.exe
        shell: pwsh
        run: |
          $env:RELAY_HOME = "$env:RUNNER_TEMP\relay-smoke"
          $p = Start-Process -FilePath build\node\node.exe -ArgumentList 'build\app\server\index.mjs','doctor' -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\doctor.txt"
          Get-Content "$env:RUNNER_TEMP\doctor.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
          build\node\node.exe -e "require('./build/app/node_modules/node-pty'); console.log('node-pty loads')"
      - name: Build the installers
        run: npx tauri build
      - name: Keep the unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: theodore-ai-hub-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Free code signing for open-source projects by the SignPath Foundation (see "Code signing policy" in README.md).
      # Runs for release tags once the repository has the variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN; until then releases ship unsigned. Each signing request is approved on signpath.io.
      - name: Sign the installers (SignPath Foundation)
        id: sign
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'theodore-ai-hub' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Keep the signed installers
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: theodore-ai-hub-windows-x64-signed
          path: signed/
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.sign.outcome == 'success' && 'signed/nsis/*.exe' || 'src-tauri/target/release/bundle/nsis/*.exe' }}
            ${{ steps.sign.outcome == 'success' && 'signed/msi/*.msi' || 'src-tauri/target/release/bundle/msi/*.msi' }}
          generate_release_notes: true
